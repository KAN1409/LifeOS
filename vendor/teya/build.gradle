def gitBlobSha = { byte[] bytes ->
    MessageDigest digest = MessageDigest.getInstance('SHA-1')
    digest.update("blob ${bytes.length}\u0000".getBytes('UTF-8'))
    digest.update(bytes)
    digest.digest().collect { String.format('%02x', it) }.join()
}

def fetchVerified = { String upstreamPath, String expectedBlobSha, File target ->
    URL url = new URL("https://raw.githubusercontent.com/adgapar/teya/${teyaRevision}/${upstreamPath}")
    byte[] bytes = url.bytes
    String actualBlobSha = gitBlobSha(bytes)
    if (actualBlobSha != expectedBlobSha) {
        throw new GradleException("Teya integrity check failed for ${upstreamPath}: expected ${expectedBlobSha}, got ${actualBlobSha}")
    }
    target.parentFile.mkdirs()
    target.bytes = bytes
}

def patchHarnessForLifeOsApproval = { File harness ->
    String text = harness.getText('UTF-8')

    String constantAnchor = '        const val ACTION_TOGGLE_TOUCH_MODE = "com.teya.agent.action.TOGGLE_TOUCH_MODE"'
    String constantPatch = '''        const val ACTION_APPROVAL_REQUEST = "com.kareem.lifeos.TEYA_APPROVAL_REQUEST"
        const val ACTION_EXECUTE_APPROVED = "com.kareem.lifeos.TEYA_EXECUTE_APPROVED"
        const val ACTION_EXECUTION_RESULT = "com.kareem.lifeos.TEYA_EXECUTION_RESULT"
        const val EXTRA_TOOL_CALL_ID = "tool_call_id"
        const val EXTRA_TOOL_NAME = "tool_name"
        const val EXTRA_TOOL_ARGS = "tool_args"
        const val EXTRA_TOOL_RESULT = "tool_result"
        const val EXTRA_TOOL_OK = "tool_ok"
        const val ACTION_TOGGLE_TOUCH_MODE = "com.teya.agent.action.TOGGLE_TOUCH_MODE"'''
    if (!text.contains(constantAnchor)) throw new GradleException('Teya Harness approval patch: constants anchor missing')
    text = text.replace(constantAnchor, constantPatch)

    String startAnchor = '''            ACTION_TOGGLE_TOUCH_MODE -> {
                configManager.touchModeEnabled = !configManager.touchModeEnabled'''
    String startPatch = '''            ACTION_EXECUTE_APPROVED -> {
                val callId = intent.getStringExtra(EXTRA_TOOL_CALL_ID).orEmpty()
                val toolName = intent.getStringExtra(EXTRA_TOOL_NAME).orEmpty()
                val rawArgs = intent.getStringExtra(EXTRA_TOOL_ARGS).orEmpty()
                scope.launch {
                    var ok = true
                    val result = try {
                        val json = org.json.JSONObject(rawArgs.ifBlank { "{}" })
                        val args = mutableMapOf<String, String>()
                        val keys = json.keys()
                        while (keys.hasNext()) {
                            val key = keys.next()
                            args[key] = json.optString(key, "")
                        }
                        executeToolUnsafe(ToolCall(callId, toolName, args))
                    } catch (t: Throwable) {
                        ok = false
                        "Execution failed: ${t.message ?: t.javaClass.simpleName}"
                    }
                    sendBroadcast(Intent(ACTION_EXECUTION_RESULT).apply {
                        setPackage(packageName)
                        putExtra(EXTRA_TOOL_CALL_ID, callId)
                        putExtra(EXTRA_TOOL_NAME, toolName)
                        putExtra(EXTRA_TOOL_RESULT, result)
                        putExtra(EXTRA_TOOL_OK, ok)
                    })
                }
            }
            ACTION_TOGGLE_TOUCH_MODE -> {
                configManager.touchModeEnabled = !configManager.touchModeEnabled'''
    if (!text.contains(startAnchor)) throw new GradleException('Teya Harness approval patch: start-command anchor missing')
    text = text.replace(startAnchor, startPatch)

    String executeAnchor = '    private suspend fun executeTool(tool: ToolCall): String = when (tool.functionName) {'
    String executePatch = '''    private val lifeOsReadOnlyTools = setOf("get_events", "read_shopping_list", "query_expenses")

    private suspend fun executeTool(tool: ToolCall): String {
        if (lifeOsReadOnlyTools.contains(tool.functionName)) return executeToolUnsafe(tool)
        sendBroadcast(Intent(ACTION_APPROVAL_REQUEST).apply {
            setPackage(packageName)
            putExtra(EXTRA_TOOL_CALL_ID, tool.id)
            putExtra(EXTRA_TOOL_NAME, tool.functionName)
            putExtra(EXTRA_TOOL_ARGS, org.json.JSONObject(tool.arguments).toString())
        })
        return "This action is waiting for approval in LifeOS Action Center."
    }

    private suspend fun executeToolUnsafe(tool: ToolCall): String = when (tool.functionName) {'''
    if (!text.contains(executeAnchor)) throw new GradleException('Teya Harness approval patch: executeTool anchor missing')
    text = text.replace(executeAnchor, executePatch)

    harness.setText(text, 'UTF-8')
}

tasks.register('syncTeyaAgentCore') {
    outputs.dir(teyaGeneratedDir)
    doLast {
        File root = teyaGeneratedDir.get().asFile
        teyaAgentCore.each { relativePath, expectedBlobSha ->
            fetchVerified("app/src/main/kotlin/${relativePath}", expectedBlobSha, new File(root, relativePath))
        }
        // The upstream blob is verified first, then a deterministic LifeOS-only approval hook is
        // applied to the generated build copy. Upstream source remains pinned and auditable.
        patchHarnessForLifeOsApproval(new File(root, 'com/teya/agent/harness/HarnessService.kt'))
    }
}

tasks.register('syncTeyaVoiceAssets') {
    outputs.dir(teyaGeneratedAssetsDir)
    doLast {
        File root = teyaGeneratedAssetsDir.get().asFile
        teyaVoiceAssets.each { fileName, expectedBlobSha ->
            fetchVerified("app/src/main/assets/${fileName}", expectedBlobSha, new File(root, fileName))
        }
    }
}

tasks.register('syncTeyaHarnessResources') {
    outputs.dir(teyaGeneratedResDir)
    doLast {
        File root = teyaGeneratedResDir.get().asFile
        fetchVerified(
            'app/src/main/res/drawable/ic_launcher_foreground.xml',
            'd9b28d853db4f65f5e90232d469d893f9f075853',
            new File(root, 'drawable/ic_launcher_foreground.xml')
        )
    }
}

tasks.register('syncTeyaNativeMicrofrontend') {
    outputs.dir(teyaNativeCheckoutDir)
    doLast {
        File checkout = teyaNativeCheckoutDir.get().asFile
        delete checkout
        checkout.mkdirs()
        exec { commandLine 'git', 'init', checkout.absolutePath }
        exec { workingDir checkout; commandLine 'git', 'remote', 'add', 'origin', 'https://github.com/adgapar/teya.git' }
        exec { workingDir checkout; commandLine 'git', 'config', 'core.sparseCheckout', 'true' }
        File sparse = new File(checkout, '.git/info/sparse-checkout')
        sparse.parentFile.mkdirs()
        sparse.text = 'app/src/main/cpp/\n'
        exec { workingDir checkout; commandLine 'git', 'fetch', '--depth', '1', 'origin', teyaRevision }
        exec { workingDir checkout; commandLine 'git', 'checkout', '--detach', 'FETCH_HEAD' }
        ByteArrayOutputStream out = new ByteArrayOutputStream()
        exec {
            workingDir checkout
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = out
        }
        String actualRevision = out.toString('UTF-8').trim()
        if (actualRevision != teyaRevision) {
            throw new GradleException("Teya native checkout revision mismatch: expected ${teyaRevision}, got ${actualRevision}")
        }
    }
}

android {
    namespace 'com.teya.agent'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file("${buildDir}/generated/upstreamNativeRepo/app/src/main/cpp/CMakeLists.txt")
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['upstream', teyaGeneratedDir]
            assets.srcDirs = [teyaGeneratedAssetsDir]
            res.srcDirs = [teyaGeneratedResDir]
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncTeyaAgentCore')
    dependsOn tasks.named('syncTeyaVoiceAssets')
    dependsOn tasks.named('syncTeyaHarnessResources')
    dependsOn tasks.named('syncTeyaNativeMicrofrontend')
}

