plugins { id 'com.android.application' }

android {
    namespace 'com.kareem.lifeos'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kareem.lifeos'
        minSdk 26
        targetSdk 35
        versionCode 48
        versionName '0.16.0-exhaustive-qa'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { versionNameSuffix '-debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

dependencies {
    implementation project(':vendor:teya')
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // OCR quality lab: multi-pass local Latin + Arabic engines. Images stay out of normal product UI until benchmark gates pass.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
