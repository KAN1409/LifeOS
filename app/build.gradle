plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kareem.lifeos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kareem.lifeos'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '0.10.9-V2-background-deep-brain'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        debug { versionNameSuffix '-debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

dependencies {
    implementation project(':vendor:teya')
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
}
