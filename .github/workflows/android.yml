name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static security and architecture QA
        run: python3 scripts/qa_static.py
      - name: Unit tests — debug and release
        run: gradle :app:testDebugUnitTest :app:testReleaseUnitTest
      - name: Compile instrumentation smoke suite
        run: gradle :app:assembleDebugAndroidTest
      - name: Android lint
        run: gradle :app:lintDebug
      - name: Assemble debug and release
        run: gradle :app:assembleDebug :app:assembleRelease
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-QA-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-V2-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  emulator-smoke:
    name: Android 35 clean-emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install emulator image
        run: |
          CMDLINE_BIN="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
          test -x "$CMDLINE_BIN/sdkmanager"
          yes | "$CMDLINE_BIN/sdkmanager" --licenses >/dev/null || true
          "$CMDLINE_BIN/sdkmanager" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
      - name: Create clean API 35 AVD
        run: |
          CMDLINE_BIN="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
          AVDMANAGER="$CMDLINE_BIN/avdmanager"
          test -x "$AVDMANAGER"
          DEVICE_ID="$("$AVDMANAGER" list device -c | grep -E '^pixel(_|$)' | head -n 1 || true)"
          if [ -n "$DEVICE_ID" ]; then
            echo "Using AVD hardware profile: $DEVICE_ID"
            echo no | "$AVDMANAGER" create avd --force --name lifeos_api35 --package "system-images;android-35;google_apis;x86_64" --device "$DEVICE_ID"
          else
            echo "No Pixel hardware profile found; using avdmanager default hardware"
            echo no | "$AVDMANAGER" create avd --force --name lifeos_api35 --package "system-images;android-35;google_apis;x86_64"
          fi
          test -f "$HOME/.android/avd/lifeos_api35.avd/config.ini"
          printf '%s\n' \
            'hw.keyboard=yes' \
            'hw.gpu.enabled=yes' \
            'hw.gpu.mode=swiftshader_indirect' \
            'disk.dataPartition.size=2048M' >> "$HOME/.android/avd/lifeos_api35.avd/config.ini"
      - name: Boot clean emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd lifeos_api35 -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect > "$RUNNER_TEMP/lifeos-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
      - name: Run LifeOS instrumentation smoke suite
        run: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p app/build/emulator-diagnostics
          timeout 10 adb shell getprop > app/build/emulator-diagnostics/getprop.txt 2>/dev/null || true
          timeout 10 adb logcat -d > app/build/emulator-diagnostics/logcat.txt 2>/dev/null || true
          cp "$RUNNER_TEMP/lifeos-emulator.log" app/build/emulator-diagnostics/emulator.log 2>/dev/null || true
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-emulator-smoke-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/emulator-diagnostics/
          if-no-files-found: ignore
